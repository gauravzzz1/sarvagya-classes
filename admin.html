<style>

*{

body{

}

.student-details{

}

.fee-details{

    gap:8px;

}

.fee-box{

}

.status-paid{

}

.status-partial{

}

.status-pending{
    color:#991b1b;
    font-weight:bold;
}

.student-actions{

    display:flex;

    gap:7px;

    margin-top:12px;

}

.edit-btn{

    background:#f59e0b;

    color:white;

    border:none;

    padding:8px 12px;

    border-radius:5px;

    cursor:pointer;

    font-size:12px;

}

.edit-btn:hover{
    background:#d97706;
}

.delete-btn{

    background:#dc2626;

    color:white;

    border:none;

    padding:8px 12px;

    border-radius:5px;

    cursor:pointer;

    font-size:12px;

}

.delete-btn:hover{
    background:#b91c1c;
}

.loading{

    text-align:center;

    color:#64748b;

    padding:15px;

}


/* MATERIAL */

.material-list{
    margin-top:10px;
}

.material{

    padding:15px;

    border:1px solid #e2e8f0;

    border-radius:8px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.material-info{
    flex:1;
}

.material-title{

    font-weight:bold;

    font-size:14px;

}

.material-details{

    color:#64748b;

    font-size:12px;

    margin-top:4px;

}

.material-file{

    color:#94a3b8;

    font-size:11px;

    margin-top:5px;

    word-break:break-all;

}

.action-area{

    display:flex;

    gap:5px;

    flex-wrap:wrap;

}

.open-btn{

    background:#2563eb;

    color:white;

    border:none;

    padding:8px 12px;

    border-radius:5px;

    cursor:pointer;

    font-size:12px;

    text-decoration:none;

    display:inline-block;

}

.open-btn:hover{
    background:#1d4ed8;
}

.home-btn{

    display:block;

    text-align:center;

    margin-top:15px;

    color:#2563eb;

    text-decoration:none;

}

.section-title{

}

hr{

}

@media(max-width:600px){

    }

    }

    }

    .material{
        flex-direction:column;

    }

    .action-area{
        width:100%;
    }

    .open-btn,
    .delete-btn{

    }

}

</style>

<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
"https://dosftayxhqvwqnutrbge.supabase.co";

const SUPABASE_KEY =
"sb_publishable_saemaeefPQJTpEPLztTw4w_jY0WQLhS";

const BUCKET_NAME =
"study material";

const MATERIAL_TABLE =
"study_materials";

const STUDENT_TABLE =
"students";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   EDITING STUDENT ID
===================================================== */

let editingStudentId = null;


/* =====================================================
   SAVE STUDENT
===================================================== */

async function saveStudent(){

    const name =
        document.getElementById("studentName")
        .value.trim();

    const standard =
        document.getElementById("studentStandard")
        .value;

    const batch =
        document.getElementById("studentBatch")
        .value.trim();

    const totalFee =
        Number(
            document.getElementById("totalFee").value
        );

    const paidFee =
        Number(
            document.getElementById("paidFee").value
        );

    const message =
        document.getElementById("studentMessage");


    message.className = "message";
    message.innerHTML = "";


    /* CHECK NAME */

    if(!name){

        message.className =
            "message error";

        message.innerHTML =
            "Please enter student name.";

        return;
    }


    /* CHECK FEE */

    if(totalFee < 0 || paidFee < 0){

        message.className =
            "message error";

        message.innerHTML =
            "Fee cannot be negative.";

        return;
    }


    if(paidFee > totalFee){

        message.className =
            "message error";

        message.innerHTML =
            "Paid fee cannot be greater than total fee.";

        return;
    }


    try{

        const studentData = {

            name:name,

            standard:standard,

            batch:batch,

            total_fee:totalFee,

            paid_fee:paidFee

        };


        let error;


        /* =================================================
           UPDATE
        ================================================= */

        if(editingStudentId){

            const result =
                await supabaseClient

                .from(STUDENT_TABLE)

                .update(studentData)

                .eq(
                    "id",
                    editingStudentId
                );

            error = result.error;

        }


        /* =================================================
           ADD
        ================================================= */

        else{

            const result =
                await supabaseClient

                .from(STUDENT_TABLE)

                .insert(studentData);

            error = result.error;

        }


        if(error){

            throw error;

        }


        /* SUCCESS */

        message.className =
            "message success";

        message.innerHTML =
            editingStudentId
            ? "✅ Student updated successfully!"
            : "✅ Student added successfully!";


        clearStudentForm();

        await loadStudents();


    }
    catch(error){

        console.log(
            "STUDENT ERROR:",
            error
        );

        message.className =
            "message error";

        message.innerHTML =
            "❌ Operation failed: " +
            error.message;

    }

}


/* =====================================================
   LOAD STUDENTS
===================================================== */

async function loadStudents(){

    const list =
        document.getElementById(
            "studentList"
        );


    list.innerHTML =
        '<div class="loading">Loading students...</div>';


    const {
        data,
        error
    } = await supabaseClient

        .from(STUDENT_TABLE)

        .select(
            "id,name,standard,batch,total_fee,paid_fee,created_at"
        )

        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error){

        console.log(
            "STUDENT LOAD ERROR:",
            error
        );

        list.innerHTML =

            '<div class="loading">' +
            'Unable to load students.<br><br>' +
            escapeHTML(error.message) +
            '</div>';

        return;
    }


    if(!data || data.length === 0){

        list.innerHTML =
            '<div class="loading">' +
            'No students added yet.' +
            '</div>';

        return;
    }


    list.innerHTML = "";


    data.forEach(
        function(student,index){

            const total =
                Number(student.total_fee || 0);

            const paid =
                Number(student.paid_fee || 0);

            const remaining =
                total - paid;


            let status;
            let statusClass;


            if(remaining <= 0){

                status = "PAID";
                statusClass = "status-paid";

            }
            else if(paid > 0){

                status = "PARTIAL";
                statusClass = "status-partial";

            }
            else{

                status = "PENDING";
                statusClass = "status-pending";

            }


            const div =
                document.createElement("div");


            div.className =
                "student-item";


            div.innerHTML = `

                <div class="student-top">

                    <div>

                        <div class="student-name">

                            ${index + 1}.
                            ${escapeHTML(student.name)}

                        </div>

                        <div class="student-details">

                            ${escapeHTML(student.standard || "")}

                            ${student.batch
                                ? " • " + escapeHTML(student.batch)
                                : ""
                            }

                        </div>

                    </div>

                </div>


                <div class="fee-details">

                    <div class="fee-box">

                        Total:
                        <strong>
                            ₹${total}
                        </strong>

                    </div>


                    <div class="fee-box">

                        Paid:
                        <strong>
                            ₹${paid}
                        </strong>

                    </div>


                    <div class="fee-box">

                        Remaining:
                        <strong>
                            ₹${remaining}
                        </strong>

                    </div>


                    <div class="fee-box ${statusClass}">

                        ${status}

                    </div>

                </div>


                <div class="student-actions">

                    <button
                        class="edit-btn"
                        onclick="editStudent('${student.id}')"
                    >
                        ✏️ EDIT
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteStudent('${student.id}')"
                    >
                        🗑️ DELETE
                    </button>

                </div>

            `;


            list.appendChild(div);

        }
    );

}


/* =====================================================
   EDIT STUDENT
===================================================== */

async function editStudent(id){

    const {
        data,
        error
    } = await supabaseClient

        .from(STUDENT_TABLE)

        .select("*")

        .eq(
            "id",
            id
        )

        .single();


    if(error){

        alert(
            "Unable to load student: " +
            error.message
        );

        return;
    }


    editingStudentId =
        data.id;


    document.getElementById(
        "studentName"
    ).value =
        data.name || "";


    document.getElementById(
        "studentStandard"
    ).value =
        data.standard || "7th";


    document.getElementById(
        "studentBatch"
    ).value =
        data.batch || "";


    document.getElementById(
        "totalFee"
    ).value =
        data.total_fee || 0;


    document.getElementById(
        "paidFee"
    ).value =
        data.paid_fee || 0;


    document.getElementById(
        "studentBtn"
    ).innerHTML =
        "💾 UPDATE STUDENT";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "block";


    document.getElementById(
        "studentName"
    ).focus();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit(){

    clearStudentForm();

}


/* =====================================================
   CLEAR STUDENT FORM
===================================================== */

function clearStudentForm(){

    editingStudentId = null;


    document.getElementById(
        "studentName"
    ).value = "";


    document.getElementById(
        "studentBatch"
    ).value = "";


    document.getElementById(
        "totalFee"
    ).value = "";


    document.getElementById(
        "paidFee"
    ).value = "";


    document.getElementById(
        "studentStandard"
    ).value = "7th";


    document.getElementById(
        "studentBtn"
    ).innerHTML =
        "➕ ADD STUDENT";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";

}


/* =====================================================
   DELETE STUDENT
===================================================== */

async function deleteStudent(id){

    if(!confirm(
        "Are you sure you want to delete this student?"
    )){

        return;
    }


    try{

        const {
            error
        } = await supabaseClient

            .from(STUDENT_TABLE)

            .delete()

            .eq(
                "id",
                id
            );


        if(error){

            throw error;

        }


        await loadStudents();


    }
    catch(error){

        console.log(
            "DELETE STUDENT ERROR:",
            error
        );

        alert(
            "Delete failed: " +
            error.message
        );

    }

}


/* =====================================================
   UPLOAD MATERIAL
===================================================== */

async function uploadMaterial(){

    const standard =
        document.getElementById(
            "standard"
        ).value;


    const subject =
        document.getElementById(
            "subject"
        ).value;


    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const fileInput =
        document.getElementById(
            "file"
        );


    const file =
        fileInput.files[0];


    const button =
        document.getElementById(
            "uploadBtn"
        );


    const message =
        document.getElementById(
            "message"
        );


    message.className =
        "message";

    message.innerHTML = "";


    if(!title){

        message.className =
            "message error";

        message.innerHTML =
            "Please enter material name.";

        return;

    }


    if(!file){

        message.className =
            "message error";

        message.innerHTML =
            "Please select a PDF or DOC/DOCX file.";

        return;

    }


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const allowedExtensions = [
        "pdf",
        "doc",
        "docx"
    ];


    if(
        !allowedExtensions.includes(
            extension
        )
    ){

        message.className =
            "message error";

        message.innerHTML =
            "Only PDF, DOC and DOCX files are allowed.";

        return;

    }


    if(
        file.size >
        20 * 1024 * 1024
    ){

        message.className =
            "message error";

        message.innerHTML =
            "File size must be below 20 MB.";

        return;

    }


    button.disabled = true;

    button.innerHTML =
        "⏳ Uploading...";


    try{

        const safeFileName =
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .substring(2,10) +
            "." +
            extension;


        const filePath =
            standard +
            "/" +
            safeFileName;


        /* UPLOAD */

        const {
            error: uploadError
        } = await supabaseClient

            .storage

            .from(
                BUCKET_NAME
            )

            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );


        if(uploadError){

            throw uploadError;

        }


        /* PUBLIC URL */

        const {
            data: publicData
        } = supabaseClient

            .storage

            .from(
                BUCKET_NAME
            )

            .getPublicUrl(
                filePath
            );


        if(
            !publicData ||
            !publicData.publicUrl
        ){

            throw new Error(
                "Unable to create public URL."
            );

        }


        const fileUrl =
            publicData.publicUrl;


        /* DATABASE */

        const {
            error: dbError
        } = await supabaseClient

            .from(
                MATERIAL_TABLE
            )

            .insert({

                title:title,

                standard:standard,

                subject:subject,

                file_name:file.name,

                file_url:fileUrl

            });


        if(dbError){

            await supabaseClient

                .storage

                .from(
                    BUCKET_NAME
                )

                .remove([
                    filePath
                ]);

            throw dbError;

        }


        message.className =
            "message success";


        message.innerHTML =
            "✅ Material uploaded successfully!";


        document.getElementById(
            "title"
        ).value = "";


        fileInput.value = "";


        await loadMaterials();

    }
    catch(error){

        console.log(
            "UPLOAD ERROR:",
            error
        );


        message.className =
            "message error";


        message.innerHTML =
            "❌ Upload failed: " +
            error.message;

    }


    button.disabled = false;

    button.innerHTML =
        "📤 UPLOAD MATERIAL";

}


/* =====================================================
   LOAD MATERIALS
===================================================== */

async function loadMaterials(){

    const list =
        document.getElementById(
            "materialList"
        );


    list.innerHTML =
        '<div class="loading">Loading...</div>';


    const {
        data,
        error
    } = await supabaseClient

        .from(
            MATERIAL_TABLE
        )

        .select("*")

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.log(
            "MATERIAL LOAD ERROR:",
            error
        );


        list.innerHTML =
            '<div class="loading">' +
            'Unable to load materials.<br><br>' +
            escapeHTML(error.message) +
            '</div>';

        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        list.innerHTML =
            '<div class="loading">' +
            'No materials uploaded yet.' +
            '</div>';

        return;

    }


    list.innerHTML = "";


    data.forEach(
        function(material){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "material";


            div.innerHTML = `

                <div class="material-info">

                    <div class="material-title">

                        ${escapeHTML(
                            material.title
                        )}

                    </div>


                    <div class="material-details">

                        ${escapeHTML(
                            material.standard
                        )}

                        • 

                        ${escapeHTML(
                            material.subject || ""
                        )}

                    </div>


                    <div class="material-file">

                        ${escapeHTML(
                            material.file_name
                        )}

                    </div>

                </div>


                <div class="action-area">

                    <a
                        href="${escapeHTML(
                            material.file_url
                        )}"
                        target="_blank"
                        class="open-btn"
                    >
                        OPEN
                    </a>


                    <button
                        class="delete-btn"
                        onclick="deleteMaterial(
                            '${material.id}',
                            '${encodeURIComponent(
                                material.file_url
                            )}'
                        )"
                    >
                        DELETE
                    </button>

                </div>

            `;


            list.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   DELETE MATERIAL
===================================================== */

async function deleteMaterial(
    id,
    encodedUrl
){

    if(!confirm(
        "Are you sure you want to delete this material?"
    )){

        return;

    }


    try{

        const fileUrl =
            decodeURIComponent(
                encodedUrl
            );


        const url =
            new URL(
                fileUrl
            );


        const decodedPath =
            decodeURIComponent(
                url.pathname
            );


        const marker =
            "/study material/";


        const markerIndex =
            decodedPath.indexOf(
                marker
            );


        if(markerIndex === -1){

            throw new Error(
                "Storage file path not found."
            );

        }


        const filePath =
            decodedPath.substring(
                markerIndex +
                marker.length
            );


        /* DELETE STORAGE */

        const {
            error: storageError
        } = await supabaseClient

            .storage

            .from(
                BUCKET_NAME
            )

            .remove([
                filePath
            ]);


        if(storageError){

            console.log(
                "Storage delete error:",
                storageError
            );

        }


        /* DELETE DATABASE */

        const {
            error: dbError
        } = await supabaseClient

            .from(
                MATERIAL_TABLE
            )

            .delete()

            .eq(
                "id",
                id
            );


        if(dbError){

            throw dbError;

        }


        await loadMaterials();

    }
    catch(error){

        console.log(
            "DELETE MATERIAL ERROR:",
            error
        );


        alert(
            "Delete failed: " +
            error.message
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value || "";

    return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

loadStudents();

loadMaterials();

</script>
