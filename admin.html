<style>

<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>SARVAGYA CLASSES</h1>

        <p>Study Material Admin Panel</p>

    </div>



    <!-- UPLOAD CARD -->

    <div class="card">

        <h2>📤 Upload Study Material</h2>


        <!-- STANDARD -->

        <label>

            Standard

        </label>


        <select id="standard">

            <option value="7th">

                7th Standard

            </option>


            <option value="8th">

                8th Standard

            </option>


            <option value="9th">

                9th Standard

            </option>

        </select>



        <!-- SUBJECT -->

        <label>

            Subject

        </label>


        <select id="subject">

            <option value="Mathematics">

                Mathematics

            </option>


            <option value="Science">

                Science

            </option>


            <option value="Test Paper">

                Test Paper

            </option>


            <option value="Other">

                Other

            </option>

        </select>



        <!-- TITLE -->

        <label>

            Material Name

        </label>


        <input

            type="text"

            id="title"

            placeholder="Example: Chapter 3 Test Paper"

        >



        <!-- FILE -->

        <label>

            Select PDF / DOCX

        </label>


        <input

            type="file"

            id="file"

            accept=".pdf,.doc,.docx"

        >



        <!-- UPLOAD BUTTON -->

        <button

            class="upload-btn"

            id="uploadBtn"

            onclick="uploadMaterial()"

        >

            📤 UPLOAD MATERIAL

        </button>



        <!-- MESSAGE -->

        <div

            id="message"

            class="message"

        >

        </div>

    </div>



    <!-- MATERIAL LIST -->

    <div class="card">

        <h2>

            📚 Uploaded Materials

        </h2>


        <div

            id="materialList"

            class="material-list"

        >

            <div class="loading">

                Loading...

            </div>

        </div>

    </div>



    <!-- HOME -->

    <a

        href="./index.html"

        class="home-btn"

    >

        ← Back to Website

    </a>


</div>



<script>


/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */


const SUPABASE_URL =

"https://dosftayxhqvwqnutrbge.supabase.co";


const SUPABASE_KEY =

"sb_publishable_saemaeefPQJTpEPLztTw4w_jY0WQLhS";


const BUCKET_NAME =

"study material";


const TABLE_NAME =

"study_materials";


const supabaseClient =

window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

);



/* =====================================================
   UPLOAD MATERIAL
   ===================================================== */


async function uploadMaterial(){


    const standard =

        document.getElementById(

            "standard"

        ).value;


    const subject =

        document.getElementById(

            "subject"

        ).value;


    const title =

        document.getElementById(

            "title"

        ).value.trim();


    const fileInput =

        document.getElementById(

            "file"

        );


    const file =

        fileInput.files[0];


    const button =

        document.getElementById(

            "uploadBtn"

        );


    const message =

        document.getElementById(

            "message"

        );



    /* RESET MESSAGE */

    message.className =

        "message";

    message.innerHTML = "";



    /* CHECK TITLE */

    if(!title){

        message.className =

            "message error";

        message.innerHTML =

            "Please enter material name.";

        return;

    }



    /* CHECK FILE */

    if(!file){

        message.className =

            "message error";

        message.innerHTML =

            "Please select a PDF or DOC/DOCX file.";

        return;

    }



    /* =================================================
       CHECK EXTENSION
       ================================================= */


    const extension =

        file.name

        .split(".")

        .pop()

        .toLowerCase();


    const allowedExtensions = [

        "pdf",

        "doc",

        "docx"

    ];


    if(

        !allowedExtensions.includes(

            extension

        )

    ){

        message.className =

            "message error";

        message.innerHTML =

            "Only PDF, DOC and DOCX files are allowed.";

        return;

    }



    /* =================================================
       FILE SIZE
       ================================================= */


    if(

        file.size >

        20 * 1024 * 1024

    ){

        message.className =

            "message error";

        message.innerHTML =

            "File size must be below 20 MB.";

        return;

    }



    /* DISABLE BUTTON */

    button.disabled = true;

    button.innerHTML =

        "⏳ Uploading...";



    try{


        /* =================================================
           CREATE SAFE FILE NAME

           Original filename is NOT used as storage key.

           This prevents errors caused by:
           Marathi
           Spaces
           &
           Special characters
           ================================================= */


        const safeFileName =

            Date.now() +

            "_" +

            Math.random()

            .toString(36)

            .substring(2,10) +

            "." +

            extension;



        /* STORAGE PATH */

        const filePath =

            standard +

            "/" +

            safeFileName;



        console.log(

            "Uploading:",

            filePath

        );



        /* =================================================
           UPLOAD FILE TO STORAGE
           ================================================= */


        const {

            error: uploadError

        } = await supabaseClient

            .storage

            .from(

                BUCKET_NAME

            )

            .upload(

                filePath,

                file,

                {

                    cacheControl:"3600",

                    upsert:false

                }

            );


        if(uploadError){

            throw uploadError;

        }



        /* =================================================
           GET PUBLIC URL
           ================================================= */


        const {

            data: publicData

        } = supabaseClient

            .storage

            .from(

                BUCKET_NAME

            )

            .getPublicUrl(

                filePath

            );


        if(

            !publicData ||

            !publicData.publicUrl

        ){

            throw new Error(

                "Unable to create public URL."

            );

        }


        const fileUrl =

            publicData.publicUrl;



        /* =================================================
           SAVE DATABASE RECORD
           ================================================= */


        const {

            error: dbError

        } = await supabaseClient

            .from(

                TABLE_NAME

            )

            .insert({

                title:title,

                standard:standard,

                subject:subject,

                file_name:file.name,

                file_url:fileUrl

            });


        /* =================================================
           DATABASE ERROR
           ================================================= */


        if(dbError){

            /* Remove uploaded file */

            await supabaseClient

                .storage

                .from(

                    BUCKET_NAME

                )

                .remove([

                    filePath

                ]);


            throw dbError;

        }



        /* =================================================
           SUCCESS
           ================================================= */


        message.className =

            "message success";


        message.innerHTML =

            "✅ Material uploaded successfully!";


        /* CLEAR TITLE */

        document.getElementById(

            "title"

        ).value = "";


        /* CLEAR FILE */

        fileInput.value = "";


        /* REFRESH LIST */

        await loadMaterials();


    }

    catch(error){


        console.log(

            "UPLOAD ERROR:",

            error

        );


        message.className =

            "message error";


        message.innerHTML =

            "❌ Upload failed: " +

            error.message;


    }



    /* ENABLE BUTTON */

    button.disabled = false;

    button.innerHTML =

        "📤 UPLOAD MATERIAL";

}



/* =====================================================
   LOAD MATERIALS
   ===================================================== */


async function loadMaterials(){


    const list =

        document.getElementById(

            "materialList"

        );


    list.innerHTML =

        '<div class="loading">Loading...</div>';



    const {

        data,

        error

    } = await supabaseClient

        .from(

            TABLE_NAME

        )

        .select("*")

        .order(

            "created_at",

            {

                ascending:false

            }

        );



    /* ERROR */

    if(error){

        console.log(

            "LOAD ERROR:",

            error

        );


        list.innerHTML =

            '<div class="loading">Unable to load materials.</div>';

        return;

    }



    /* NO DATA */

    if(

        !data ||

        data.length === 0

    ){

        list.innerHTML =

            '<div class="loading">No materials uploaded yet.</div>';

        return;

    }



    /* CLEAR */

    list.innerHTML = "";



    /* CREATE ITEMS */

    data.forEach(

        function(material){


            const div =

                document.createElement(

                    "div"

                );


            div.className =

                "material";



            div.innerHTML = `

                <div class="material-info">

                    <div class="material-title">

                        ${escapeHTML(material.title)}

                    </div>


                    <div class="material-details">

                        ${escapeHTML(material.standard)}

                        • 

                        ${escapeHTML(material.subject || "")}

                    </div>


                    <div class="material-file">

                        ${escapeHTML(material.file_name)}

                    </div>

                </div>


                <div class="action-area">

                    <a

                        href="${escapeHTML(material.file_url)}"

                        target="_blank"

                        class="open-btn"

                    >

                        OPEN

                    </a>


                    <button

                        class="delete-btn"

                        onclick="deleteMaterial(

                            '${material.id}',

                            '${encodeURIComponent(material.file_url)}'

                        )"

                    >

                        DELETE

                    </button>

                </div>

            `;


            list.appendChild(

                div

            );

        }

    );

}



/* =====================================================
   DELETE MATERIAL
   ===================================================== */


async function deleteMaterial(

    id,

    encodedUrl

){


    if(

        !confirm(

            "Are you sure you want to delete this material?"

        )

    ){

        return;

    }



    try{


        /* DECODE URL */

        const fileUrl =

            decodeURIComponent(

                encodedUrl

            );


        const url =

            new URL(

                fileUrl

            );


        /* =================================================
           FIND STORAGE PATH

           Example URL:

           /storage/v1/object/public/study%20material/7th/file.pdf

           We extract:

           7th/file.pdf
           ================================================= */


        const pathMarker =

            "/study%20material/";


        const decodedPath =

            decodeURIComponent(

                url.pathname

            );


        const marker =

            "/study material/";


        const markerIndex =

            decodedPath.indexOf(

                marker

            );


        if(markerIndex === -1){

            throw new Error(

                "Storage file path not found."

            );

        }


        const filePath =

            decodedPath.substring(

                markerIndex +

                marker.length

            );



        console.log(

            "Deleting:",

            filePath

        );



        /* =================================================
           DELETE STORAGE FILE
           ================================================= */


        const {

            error: storageError

        } = await supabaseClient

            .storage

            .from(

                BUCKET_NAME

            )

            .remove([

                filePath

            ]);



        if(storageError){

            console.log(

                "Storage delete error:",

                storageError

            );

        }



        /* =================================================
           DELETE DATABASE RECORD
           ================================================= */


        const {

            error: dbError

        } = await supabaseClient

            .from(

                TABLE_NAME

            )

            .delete()

            .eq(

                "id",

                id

            );


        if(dbError){

            throw dbError;

        }



        /* REFRESH */

        await loadMaterials();


    }

    catch(error){


        console.log(

            "DELETE ERROR:",

            error

        );


        alert(

            "Delete failed: " +

            error.message

        );

    }

}



/* =====================================================
   ESCAPE HTML
   ===================================================== */


function escapeHTML(value){


    const div =

        document.createElement(

            "div"

        );


    div.textContent =

        value || "";


    return div.innerHTML;

}



/* =====================================================
   START
   ===================================================== */


loadMaterials();

</script>


</body>

</html>
